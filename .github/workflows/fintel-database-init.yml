name: FINTEL Database Initialization

on:
  workflow_dispatch:

jobs:
  initialize-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FINTEL
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Drizzle configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "if (!process.env.DATABASE_URL) { throw new Error('DATABASE_URL secret is missing') }; console.log('DATABASE_URL secret detected')"

      - name: Push FINTEL schema to Aiven
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit push

