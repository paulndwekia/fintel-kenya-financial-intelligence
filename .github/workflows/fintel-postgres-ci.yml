name: FINTEL PostgreSQL CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/fintel-neon-postgres-fresh-start

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Install dependencies and refresh the lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
