name: FINTEL Database Repair And Verification

on:
  workflow_dispatch:

jobs:
  repair-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FINTEL
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "const u=(process.env.DATABASE_URL||'').trim(); if(!u) throw new Error('DATABASE_URL secret is missing'); console.log('DATABASE_URL secret detected')"

      - name: Apply complete FINTEL schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit push

      - name: Verify database and core FINTEL tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const mysql = require("mysql2/promise");

          async function main() {
            const uri = (process.env.DATABASE_URL || "").trim();

            if (!uri) {
              throw new Error("DATABASE_URL is empty");
            }

            const connection = await mysql.createConnection(uri);

            const [dbRows] = await connection.query(
              "SELECT DATABASE() AS database_name"
            );

            console.log(
              "Connected to database:",
              dbRows[0]?.database_name
            );

            const [rows] = await connection.query(
              "SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema = DATABASE() ORDER BY TABLE_NAME"
            );

            const tables = rows.map(
              row => String(row.TABLE_NAME)
            );

            console.log("Tables found:", tables.length);
            console.log(tables.join("\n"));

            const required = [
              "users",
              "data_sources",
              "market_data",
              "treasury_bills",
              "treasury_bonds",
              "fx_rates",
              "yield_curve",
              "portfolios",
              "portfolio_positions",
              "risk_results",
              "pricing_results",
              "model_runs",
              "system_status"
            ];

            const missing = required.filter(
              table => !tables.includes(table)
            );

            if (missing.length > 0) {
              console.error("Missing required tables:");
              console.error(missing.join("\n"));
              process.exit(1);
            }

            console.log("");
            console.log("ALL CORE FINTEL TABLES PRESENT");
            await connection.end();
          }

          main().catch(error => {
            console.error(
              "Database verification failed:",
              error instanceof Error
                ? error.message
                : error
            );
            process.exit(1);
          });
          NODE

      - name: Verify core table access
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const mysql = require("mysql2/promise");

          async function main() {
            const connection = await mysql.createConnection(
              (process.env.DATABASE_URL || "").trim()
            );

            const checks = [
              ["users", "SELECT COUNT(*) AS count FROM users"],
              ["data_sources", "SELECT COUNT(*) AS count FROM data_sources"],
              ["market_data", "SELECT COUNT(*) AS count FROM market_data"],
              ["yield_curve", "SELECT COUNT(*) AS count FROM yield_curve"]
            ];

            for (const [name, sql] of checks) {
              const [rows] = await connection.query(sql);
              console.log(`${name}: ${rows[0].count} rows`);
            }

            await connection.end();
            console.log("CORE TABLE ACCESS VERIFIED");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
