name: FINTEL Database Repair And Verification

on:
  workflow_dispatch:

jobs:
  repair-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FINTEL
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify DATABASE_URL exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL secret missing'); console.log('DATABASE_URL detected')"

      - name: Apply complete FINTEL schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm exec drizzle-kit push

      - name: Verify all FINTEL tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const mysql = require("mysql2/promise");

          const expected = [
            "users",
            "data_sources",
            "ingestion_runs",
            "market_data",
            "treasury_bills",
            "treasury_bonds",
            "fx_rates",
            "historical_prices",
            "yield_curve",
            "instruments",
            "portfolios",
            "portfolio_positions",
            "risk_results",
            "pricing_results",
            "model_runs",
            "system_status",
            "audit_logs",
            "research_sessions",
            "research_messages",
            "research_documents"
          ];

          async function main() {
            const url = new URL(process.env.DATABASE_URL);

            const pool = await mysql.createPool({
              host: url.hostname,
              port: Number(url.port || 3306),
              user: decodeURIComponent(url.username),
              password: decodeURIComponent(url.password),
              database: url.pathname.replace(/^\//, ""),
              ssl: {
                rejectUnauthorized: true
              }
            });

            const [rows] = await pool.query(
              "SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema = DATABASE()"
            );

            const found = new Set(
              rows.map(r => String(r.TABLE_NAME))
            );

            const missing = expected.filter(
              table => !found.has(table)
            );

            console.log("DATABASE HOST:", url.hostname);
            console.log("DATABASE NAME:", url.pathname.replace(/^\//, ""));
            console.log("EXPECTED TABLES:", expected.length);
            console.log("FOUND TABLES:", found.size);

            if (missing.length) {
              console.error("MISSING TABLES:");
              for (const table of missing) {
                console.error(" - " + table);
              }

              process.exit(1);
            }

            console.log("ALL FINTEL TABLES PRESENT");
            await pool.end();
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Register FINTEL connectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const mysql = require("mysql2/promise");

          async function main() {
            const url = new URL(process.env.DATABASE_URL);

            const db = await mysql.createPool({
              host: url.hostname,
              port: Number(url.port || 3306),
              user: decodeURIComponent(url.username),
              password: decodeURIComponent(url.password),
              database: url.pathname.replace(/^\//, ""),
              ssl: {
                rejectUnauthorized: true
              }
            });

            const connectors = [
              [
                "CBK Market Data",
                "CBK",
                "https://www.centralbank.go.ke/"
              ],
              [
                "CBK Foreign Exchange",
                "CBK",
                "https://www.centralbank.go.ke/"
              ],
              [
                "CBK Treasury Bills",
                "CBK",
                "https://www.centralbank.go.ke/"
              ],
              [
                "CBK Treasury Bonds",
                "CBK",
                "https://www.centralbank.go.ke/"
              ],
              [
                "Historical Market Database",
                "DATABASE",
                null
              ]
            ];

            for (const [name, sourceType, endpoint] of connectors) {
              await db.execute(
                `INSERT INTO data_sources
                 (name, sourceType, endpoint, status, expectedFrequency, quality, scheduleEnabled)
                 VALUES (?, ?, ?, 'DATA REQUIRED', 'DAILY', 'UNKNOWN', false)
                 ON DUPLICATE KEY UPDATE
                   sourceType = VALUES(sourceType),
                   endpoint = VALUES(endpoint)`,
                [name, sourceType, endpoint]
              );
            }

            console.log("FINTEL connector registry ready");
            await db.end();
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
