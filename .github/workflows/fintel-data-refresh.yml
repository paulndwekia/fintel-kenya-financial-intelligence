name: FINTEL data refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fintel-data-refresh.yml"
      - "server/scheduler.ts"
      - "server/ingestion/cbk.ts"
      - "server/ingestion/phase2.ts"
      - "server/db.ts"
  schedule:
    - cron: "15 6 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fintel-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Request scoped GitHub Actions identity and refresh CBK data
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule || '' }}
          API_BASE_URL: https://fintel-kenya-financial-intelligence.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Wait for Render to serve this exact commit and for Neon readiness
          # before requesting a short-lived OIDC token for the ingestion calls.
          deployed=false
          for attempt in $(seq 1 48); do
            health_json="$(curl --silent --show-error "${API_BASE_URL}/api/system/health" || true)"
            deployed_commit="$(jq -r '.commit // empty' <<< "${health_json}" 2>/dev/null || true)"
            if [[ "${deployed_commit}" == "${EXPECTED_COMMIT}" ]]; then
              readiness_json="$(curl --silent --show-error "${API_BASE_URL}/api/system/readiness" || true)"
              database_status="$(jq -r '.status // empty' <<< "${readiness_json}" 2>/dev/null || true)"
              if [[ "${database_status}" == "ready" ]]; then
                deployed=true
                echo "Render is serving ${EXPECTED_COMMIT} and Neon is ready."
                break
              fi
            fi
            if (( attempt == 48 )); then
              echo "Render did not serve the expected commit with a ready database. Last commit: ${deployed_commit:-unknown}; database: ${database_status:-unknown}."
              exit 1
            fi
            sleep 10
          done

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ffintel-kenya-financial-intelligence.onrender.com")"
          oidc_token="$(jq -r '.value // empty' <<< "$oidc_response")"
          if [[ -z "$oidc_token" ]]; then
            echo "GitHub did not return an OIDC identity token."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            sources=("CBK key rates and FX" "CBK Treasury Bills" "CBK Treasury Bonds" "Historical market database")
          elif [[ "$SCHEDULED_CRON" == "15 6 * * 1-5" ]]; then
            sources=("CBK key rates and FX")
          elif [[ "$SCHEDULED_CRON" == "30 10 * * 1-5" ]]; then
            sources=("CBK Treasury Bills")
          elif [[ "$SCHEDULED_CRON" == "0 11 * * 1-5" ]]; then
            sources=("CBK Treasury Bonds")
          elif [[ "$SCHEDULED_CRON" == "0 2 * * 0" ]]; then
            sources=("Historical market database")
          else
            echo "Unrecognized scheduled event: $SCHEDULED_CRON"
            exit 1
          fi

          failed=0
          for source in "${sources[@]}"; do
            encoded_source="$(jq -rn --arg value "$source" '$value | @uri')"
            echo "Refreshing: $source"
            if ! response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --retry 3 --retry-all-errors --retry-delay 8 \
              -H "Authorization: Bearer $oidc_token" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "${API_BASE_URL}/api/scheduled/cbk-ingestion?source=${encoded_source}")"; then
              echo "Request failed for $source."
              failed=1
              continue
            fi

            echo "$response"
            if ! jq -e --arg source "$source" '.ok == true and .source == $source and .status == "CURRENT"' <<< "$response" >/dev/null; then
              echo "The ingestion response for $source was not a verified CURRENT result."
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more CBK sources did not complete with CURRENT status."
            exit 1
          fi
