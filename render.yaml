services:
  - type: web
    name: fintel-kenya-financial-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/system/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ALLOWED_ORIGIN
        sync: false

      - key: LOCAL_AUTH_ENABLED
        value: "true"

      - key: FINTEL_ADMIN_EMAIL
        sync: false

      - key: FINTEL_ADMIN_PASSWORD
        sync: false

      - key: FINTEL_ADMIN_NAME
        value: "FINTEL Administrator"

      - key: CBK_SCHEDULER_ENABLED
        value: "false"

      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: GOOGLE_AI_API_KEY
        sync: false
